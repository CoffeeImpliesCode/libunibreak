# Verification for this fork's Zig package.
#
# This file is written for this repository and names this repository's gates.
# It is entirely fork-authored: upstream ships no CI at this pin — there is no
# `.github/` directory in the tree at `libunibreak_8_0` — so there is no
# upstream workflow to retarget, to exclude from `.paths`, or to stop running
# against another maintainer's infrastructure. Nothing here publishes anything.
#
# WHAT THIS FILE IS NOT
# ---------------------
# No gate in this package has been run. Nothing here has been executed: CI has
# not run, this repository is local, and nothing in this file is a result. Every
# command below is written down so that the run is well defined when it happens;
# none of them has produced an outcome. The authoritative status of every gate
# is the one table in `README.zig.md`, where every row reads NOT RUN. This file
# must not be edited to imply otherwise.
#
# WHAT IT DOES NOT DO
# -------------------
# * It does not publish. No artifact is uploaded, no release is created, no
#   package is pushed, and `permissions` is `contents: read` so the token cannot
#   write to this repository even by accident.
# * It does not mark any target `continue-on-error` and does not mark any step
#   `|| true`. Nothing here has been observed to fail, and pre-labelling a
#   failure as expected is a claim about a run that never happened. If a target
#   turns out to be unsupported, the fix is to record that here with the
#   compiler output that showed it, not to silence it.
# * It does not exercise a system-library mode. This package has none: the
#   contract for this wave keeps the source pin and the bounded contracts
#   identical in every mode, and translating these headers against an installed
#   libunibreak of unknown version is exactly the header/ABI mismatch the fork
#   contract forbids (`WISDOM.md` W14). The absence is documented as NOT
#   APPLICABLE in `build.zig` and in `README.zig.md` rather than claimed as
#   satisfied.
# * It does not run `cross-test`. The published 53-platform matrix is a harness
#   the driver runs on this host with its own receipts; a CI runner that cannot
#   execute a target reports a compile, not a test, and a compile reported as a
#   pass is the failure mode this workspace treats most seriously.
# * It does not run the runtime loader's behavioural gates. `-Druntime=true` is
#   gated here as a compile — the generated dispatch, the facade and the explicit
#   exercise must agree on the translated types for all six targets and both
#   linkages — because a CI runner has no provider library to name and
#   faking one would gate a mock rather than the loader. The load, failure,
#   retry, idempotence and pre-readiness-panic behaviour is the driver's, with
#   a provider it built itself.
#
# THE DELIVERY OPTIONS
# --------------------
# `-Dlinkage=static|dynamic` and `-Druntime=true` are declared in `build.zig`,
# both default to what this SDK produced before they existed, and the `shared`,
# `runtime` and extended `consumer` jobs exist so that neither is an option
# nobody has ever built. The `shared` job's assertions are deliberately narrow:
# a C program linked through the installed `libunibreak.pc` and run against
# known UAX #14 / UAX #29 answers, the exported symbol table read out of the
# produced `.so`, and the `SONAME` read out of it.
#
# `-Dlinkage=dynamic` for a target with no dynamic linker is **refused**, never
# answered with a static archive. `wasm32-wasi` is that target in this package's
# matrix, and the `shared` job gates the refusal rather than a build: the
# command must fail, and the failure must name the reason and the way out.
#
# CACHE AND SCRATCH PLACEMENT
# --------------------------
# `ZIG_FLAGS` puts Zig's local cache in `.zig-cache/` inside the checked-out
# workspace, and the generated C gate goes in `$RUNNER_TEMP`. Both are the
# runner's own ephemeral disk: the workspace is the checkout GitHub already
# provisions and `$RUNNER_TEMP` is the per-job scratch directory. Nothing is
# written to `/tmp`, `/var/tmp` or any shared path, and nothing is written
# outside the job. This is deliberately different from the host-side gates,
# which source `$HOME/.local/lib/host-scratch.sh` and use
# `"$HOST_SCRATCH_ROOT/cache/foundation-libs"` (AGENTS.md §6): a GitHub runner is
# not the gruenau host, has no `$HOME/.local/lib`, and must not be pointed at a
# mount it does not have.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_FLAGS: -j8 --summary all --cache-dir .zig-cache

jobs:
  # The pin, the per-file record and upstream's bytes. This job runs before
  # anything is compiled: a package whose provenance does not match is not a
  # package worth building.
  provenance:
    name: upstream pin and integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the second step below reads the pinned
          # commit's blobs out of this clone's object store.
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0


      # The real gate. UPSTREAM.sha256 names the upstream-owned entries of
      # .paths, so this works in a cloned repository and in an unpacked package
      # fetched by a dependent.
      - name: immutable source integrity
        run: sha256sum -c UPSTREAM.sha256

      # The same 59 digests, re-derived from the pinned commit's blobs rather
      # than from the files on disk. This is the check that makes
      # UPSTREAM.sha256 a claim about upstream's bytes: a working-tree file that
      # this fork has edited — `.gitignore` is the one, and it is deliberately
      # absent from the record for exactly that reason — cannot satisfy it.
      - name: the record describes upstream's blobs, not this working tree
        run: |
          set -euo pipefail
          pinned=28a2756b864c343f438cd22537d49d394d4666a5
          checked=0
          while read -r expected path; do
            case "$expected" in \#*) continue ;; esac
            actual=$(git cat-file blob "$pinned:$path" | sha256sum | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$path hashes to $actual in the pinned tree but the record says $expected" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < UPSTREAM.sha256
          if [ "$checked" -ne 59 ]; then
            echo "::error::expected 59 records, checked $checked" >&2
            exit 1
          fi
          echo "59 records re-derived from the pinned blobs"

  native:
    name: native build, tests, example and upstream harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Installs zig-out/lib/libunibreak.a, the five public headers under
      # zig-out/include/, zig-out/lib/pkgconfig/libunibreak.pc, the two carried
      # licence texts and upstream's own README at the prefix root, and compiles
      # the example. The install layout is the build graph's own; nothing here
      # reproduces it.
      - name: build and install
        run: zig build $ZIG_FLAGS

      # Every other step in this job reaches libunibreak through the Zig
      # facade. This one reaches it the way a C program does: the installed
      # public headers, the installed static archive, and no Zig code at all.
      # None of the other steps would notice a facade that is correct while the
      # C surface a C caller compiles against is not, and this fork is a C
      # library first.
      #
      # The expected values are derived from the UAX #14, UAX #29 and UAX #29
      # rules written in the comments beside them, not read back out of this
      # build, so a wrong answer and a wrong expectation fail this differently.
      - name: installed C headers compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          /* The installed libunibreak C surface, reached the way a C program
           * reaches it: the five installed public headers, the installed static
           * archive, and no Zig code at all. Every other step in this job
           * reaches the library through the Zig facade, so none of them would
           * notice a facade that is correct while the C surface a C caller
           * compiles against is not, and this fork is a C library first.
           *
           * The five headers are upstream's own `include_HEADERS`:
           * unibreakbase.h, unibreakdef.h, linebreak.h, graphemebreak.h and
           * wordbreak.h. No configuration macro is needed and none is passed:
           * every one of them compiles unconfigured. */
          #include <unibreakbase.h>
          #include <unibreakdef.h>
          #include <linebreak.h>
          #include <graphemebreak.h>
          #include <wordbreak.h>

          #include <stdio.h>
          #include <string.h>

          static int gFailures = 0;

          static void expect(int condition, const char *what) {
              if (condition) {
                  printf("ok    %s\n", what);
              } else {
                  printf("FAIL  %s\n", what);
                  gFailures += 1;
              }
          }

          static void expectAt(size_t index, int condition, const char *what) {
              if (condition) {
                  printf("ok    [%lu] %s\n", (unsigned long)index, what);
              } else {
                  printf("FAIL  [%lu] %s\n", (unsigned long)index, what);
                  gFailures += 1;
              }
          }

          /* "A B": LATIN CAPITAL LETTER A, SPACE, LATIN CAPITAL LETTER B. Every
           * code point is one UTF-32 code unit and one ASCII byte, so the three
           * encodings below have different lengths and identical answers. */
          static const utf32_t kSpaces[] = { 0x0041, 0x0020, 0x0042 };
          static const utf16_t kSpaces16[] = { 0x0041, 0x0020, 0x0042 };
          static const utf8_t kSpaces8[] = { 'A', ' ', 'B' };

          /* "A\n": the hard line break of UAX #14 rule LB5. */
          static const utf32_t kNewline[] = { 0x0041, 0x000A };

          /* "1,0": DIGIT ONE, COMMA, DIGIT ZERO. UAX #29 rules WB11 and WB12
           * keep the comma inside the number. */
          static const utf32_t kNumber[] = { 0x0031, 0x002C, 0x0030 };

          /* "a" plus COMBINING DIAERESIS: UAX #29 rule GB9 forbids a break
           * before an Extend. */
          static const utf32_t kCluster[] = { 0x0061, 0x0308 };

          int main(void) {
              char brks32[8];
              char brks16[8];
              char brks8[8];
              size_t i;

              printf("libunibreak version word: 0x%x\n", unibreak_version);

              /* Upstream's own initialisers are empty bodies kept for binary
               * compatibility. They are in the public API and this program
               * calls them, because a C caller may. */
              init_linebreak();
              init_wordbreak();
              init_graphemebreak();

              /* LB7 forbids a break before a space; LB18 allows one after it.
               * This is an opportunity, not a mandatory newline. The final
               * non-EOL position is INDETERMINATE, a distinct fifth value. */
              memset(brks32, 0x7f, sizeof brks32);
              set_linebreaks_utf32(kSpaces, 3, "-strict", brks32);
              expectAt(0, brks32[0] == LINEBREAK_NOBREAK,
                       "LB7 forbids a break before the space");
              expectAt(1, brks32[1] == LINEBREAK_ALLOWBREAK,
                       "LB18 allows a break after the space");
              expectAt(2, brks32[2] == LINEBREAK_INDETERMINATE,
                       "the final position is indeterminate, not mandatory");

              /* The same three code points in the other two encodings must give
               * the same three answers. This is the contract that makes a
               * per-code-unit buffer's length the input's length in that
               * encoding's own code units. */
              memset(brks16, 0x7f, sizeof brks16);
              set_linebreaks_utf16(kSpaces16, 3, "-strict", brks16);
              memset(brks8, 0x7f, sizeof brks8);
              set_linebreaks_utf8(kSpaces8, 3, "-strict", brks8);
              for (i = 0; i < 3; i++) {
                  expectAt(i, brks16[i] == brks32[i],
                           "UTF-16 agrees with UTF-32 on this position");
                  expectAt(i, brks8[i] == brks32[i],
                           "UTF-8 agrees with UTF-32 on this position");
              }

              /* The per-code-point form is the only one that tells the caller how
               * many entries it wrote, and it returns the number of code points
               * for well-formed input. Here all three are single-unit code
               * points, so the answers coincide and the count is 3. */
              {
                  char per_point[8];
                  size_t written;
                  memset(per_point, 0x7f, sizeof per_point);
                  written = set_linebreaks_utf8_per_code_point(
                      kSpaces8, 3, "-strict", per_point);
                  expect(written == 3, "the per-code-point pass reports 3 entries");
                  for (i = 0; i < 3; i++) {
                      expectAt(i, per_point[i] == brks32[i],
                               "per-code-point agrees with per-code-unit here");
                  }
              }

              /* LB6 forbids a break before LF. LB5 requires the final break
               * after LF rather than an indeterminate end-of-input result. */
              memset(brks32, 0x7f, sizeof brks32);
              set_linebreaks_utf32(kNewline, 2, "", brks32);
              expectAt(0, brks32[0] == LINEBREAK_NOBREAK,
                       "LB6 forbids a break before the newline");
              expectAt(1, brks32[1] == LINEBREAK_MUSTBREAK,
                       "the final position after a newline is mandatory");

              /* `is_line_breakable` is the pair query. It returns the same
               * decision the first entry of a full pass makes for the same two
               * characters, which is what makes it usable at all. Upstream's own
               * documentation recommends against it for text with combining
               * marks or spaces, because a pair carries no context. */
              expect(is_line_breakable(0x0041, 0x0020, "-strict")
                         == LINEBREAK_NOBREAK,
                     "the pair query agrees with the full pass on 'A' then space");
              expect(is_line_breakable(0x0041, 0x0042, "-strict")
                         == LINEBREAK_NOBREAK,
                     "two letters do not break between them");

              /* UAX #29 word breaking, rules WB11 and WB12. `set_wordbreaks_*`
               * treats the final position as an ordinary boundary, so there is
               * no indeterminate value here and no fourth opcode. */
              memset(brks32, 0x7f, sizeof brks32);
              set_wordbreaks_utf32(kNumber, 3, "", brks32);
              expectAt(0, brks32[0] == WORDBREAK_NOBREAK,
                       "WB11 keeps the comma inside the number");
              expectAt(1, brks32[1] == WORDBREAK_NOBREAK,
                       "WB12 keeps the digits of the number together");
              expectAt(2, brks32[2] == WORDBREAK_BREAK,
                       "the final position is a word boundary");

              /* UAX #29 grapheme cluster breaking, rule GB9. */
              memset(brks32, 0x7f, sizeof brks32);
              set_graphemebreaks_utf32(kCluster, 2, "", brks32);
              expectAt(0, brks32[0] == GRAPHEMEBREAK_NOBREAK,
                       "GB9 forbids a break before a combining mark");
              expectAt(1, brks32[1] == GRAPHEMEBREAK_BREAK,
                       "the final position is a cluster boundary");

              /* The raw line-breaking entry point returns on empty input.
               * Raw grapheme entry points do not share this guarantee; use
               * the typed empty-input guard for those. */
              memset(brks32, 0x7f, sizeof brks32);
              set_linebreaks_utf32(kSpaces, 0, "", brks32);
              expect((unsigned char)brks32[0] == 0x7f,
                     "empty input leaves the output buffer untouched");

              if (gFailures != 0) {
                  printf("%d check(s) failed\n", gFailures);
                  return 1;
              }

              printf("the installed C surface compiled, linked and ran\n");
              return 0;
          }
          C
          zig cc \
            -std=c99 \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface_gate.c" \
            zig-out/lib/libunibreak.a \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # Upstream's own conformance harness, compiled unmodified and run three
      # times against the three checked-in Unicode fixtures, from src/. This is
      # the only step that reaches the fixtures through upstream's own parser;
      # the Zig tests reach them through this fork's.
      - name: upstream's own conformance harness
        run: zig build upstream-test $ZIG_FLAGS

      # Debug and ReleaseSafe are the two modes where Zig's safety checks are
      # live. They are run separately because `test` is a real addTest plus
      # addRunArtifact for whatever `-Dtarget` names, and running it once with a
      # forwarded -Doptimize would only re-execute the same binary.
      - name: test (Debug)
        run: zig build test -Doptimize=Debug $ZIG_FLAGS
      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe $ZIG_FLAGS

      # `std.testing.refAllDeclsRecursive` would not prove a body was
      # instantiated; this step calls every public facade method and every
      # translated entry point once, for real.
      - name: exercise every public facade method
        run: zig build exercise $ZIG_FLAGS

      - name: example
        run: zig build smoke $ZIG_FLAGS

  # `-Dlinkage=dynamic` is a real shared object, not a differently named
  # archive, so it is gated the ways that can only be checked on one: that a C
  # program links it through the installed pkg-config metadata, that the dynamic
  # symbol table actually carries the exported surface, that the `SONAME` is the
  # one upstream's `-version-info 8:0:0` gives, and that every matrix target
  # with a dynamic linker compiles in that mode.
  #
  # The sixth target is not in that loop. `wasm32-wasi` has no dynamic linker,
  # so a shared object there is a file nothing can load; the build graph
  # **refuses** `-Dlinkage=dynamic` for that target rather than handing back a
  # static archive with a warning, and this job gates that refusal instead: it
  # runs the same command, requires it to fail, and requires the failure to
  # say why. That is an assertion about the intended behaviour, not a
  # pre-labelled failure.
  shared:
    name: shared delivery, pkg-config consumer and export surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build and install the shared variant
        run: zig build -Dlinkage=dynamic $ZIG_FLAGS

      # The same C program the static job compiles, reached the way a package
      # manager's consumer reaches it: through `libunibreak.pc` rather than
      # through a hard-coded archive path. That is what makes the generated
      # metadata a gate instead of a file that merely exists.
      - name: installed pkg-config metadata drives a C consumer
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --exists libunibreak
          echo "cflags: $(pkg-config --cflags libunibreak)"
          echo "libs:   $(pkg-config --libs libunibreak)"
          cat > "$RUNNER_TEMP/c_shared_gate.c" <<'C'
          /* The shared libunibreak C surface, reached the way a C program
           * reaches it: the installed public headers and the installed shared
           * object, with every include and library flag coming from the
           * installed libunibreak.pc rather than from a path written here.
           *
           * The expected opcodes are the UAX #14 and UAX #29 rules written in
           * the comments beside them, not read back out of this build. */
          #include <unibreakbase.h>
          #include <linebreak.h>
          #include <wordbreak.h>
          #include <graphemebreak.h>

          #include <stdio.h>
          #include <string.h>

          int main(void) {
              /* "A B": LB7 forbids a break before the space, LB18 allows one
               * after it, and the final position is INDETERMINATE. */
              static const utf32_t spaces[] = { 0x0041, 0x0020, 0x0042 };
              /* "1,0": WB11 and WB12 keep the comma inside the number. */
              static const utf32_t number[] = { 0x0031, 0x002C, 0x0030 };
              /* "a" plus COMBINING DIAERESIS: GB9 forbids a break before an
               * Extend. */
              static const utf32_t cluster[] = { 0x0061, 0x0308 };
              char brks[8];
              int failures = 0;

              printf("libunibreak version word: 0x%x\n", unibreak_version);
              if (unibreak_version != UNIBREAK_VERSION) {
                  printf("FAIL  unibreak_version is not UNIBREAK_VERSION\n");
                  failures += 1;
              }

              init_linebreak();
              init_wordbreak();
              init_graphemebreak();

              memset(brks, 0x7f, sizeof brks);
              set_linebreaks_utf32(spaces, 3, "-strict", brks);
              if (brks[0] != LINEBREAK_NOBREAK ||
                  brks[1] != LINEBREAK_ALLOWBREAK ||
                  brks[2] != LINEBREAK_INDETERMINATE) {
                  printf("FAIL  line break opcodes for \"A B\" are wrong\n");
                  failures += 1;
              }

              memset(brks, 0x7f, sizeof brks);
              set_wordbreaks_utf32(number, 3, "", brks);
              if (brks[0] != WORDBREAK_NOBREAK ||
                  brks[1] != WORDBREAK_NOBREAK ||
                  brks[2] != WORDBREAK_BREAK) {
                  printf("FAIL  word break opcodes for \"1,0\" are wrong\n");
                  failures += 1;
              }

              memset(brks, 0x7f, sizeof brks);
              set_graphemebreaks_utf32(cluster, 2, "", brks);
              if (brks[0] != GRAPHEMEBREAK_NOBREAK ||
                  brks[1] != GRAPHEMEBREAK_BREAK) {
                  printf("FAIL  grapheme break opcodes for \"a\\u0308\" are wrong\n");
                  failures += 1;
              }

              if (failures != 0) {
                  printf("%d check(s) failed\n", failures);
                  return 1;
              }
              printf("the installed shared C surface linked, ran and agreed\n");
              return 0;
          }
          C
          # shellcheck disable=SC2046
          zig cc -std=c99 $(pkg-config --cflags libunibreak) \
            "$RUNNER_TEMP/c_shared_gate.c" $(pkg-config --libs libunibreak) \
            -o "$RUNNER_TEMP/c_shared_gate"
          LD_LIBRARY_PATH="$PWD/zig-out/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$RUNNER_TEMP/c_shared_gate"

      # The exported set is the evidence for "a real shared object with a real
      # export surface". Upstream's five public headers declare no visibility or
      # `__declspec` macro at all, so there is nothing to narrow to the public
      # API and this build deliberately adds no `-fvisibility=hidden` and no
      # version script; what must hold is that the five headers' entry points
      # and `unibreak_version` are all present and all global. Printing the whole
      # table means a change to the surface is visible in the log rather than
      # only in a pass.
      - name: exported symbols of the installed shared object
        run: |
          set -euo pipefail
          # The versioned file, the `SONAME` symlink and the linker name. Picked
          # with a glob rather than `ls | grep | head`, which under `pipefail`
          # can fail on SIGPIPE from the producer for a reason that has nothing
          # to do with this library.
          so=""
          for f in zig-out/lib/libunibreak.so.*; do
            case "$f" in *.so.8) continue ;; esac
            so="$f"
            break
          done
          test -n "$so"
          echo "versioned shared object: $so"
          test -f zig-out/lib/libunibreak.so.8
          test -e zig-out/lib/libunibreak.so
          nm -D --defined-only "$so" | tee "$RUNNER_TEMP/exports.txt"
          # The eighteen functions the installed public headers declare:
          # src/linebreak.h:65-76 (seven), src/wordbreak.h:64-70 (four),
          # src/graphemebreak.h:61-67 (four) and src/unibreakdef.h:61-63 (three),
          # plus `unibreak_version`, which src/unibreakbase.h:43 declares and
          # src/unibreakbase.c:38 defines.
          # One declaration is deliberately absent from that count:
          # `unibreakdef.h:65` declares `ub_bsearch` as `inline` *with a body*,
          # and `unibreakdef.c:175` gives it an external definition with
          # `extern inline`, so a consumer compiles its own inline copy and
          # requiring it in the dynamic table would be asserting where the
          # compiler placed it rather than whether the library exports it.
          # `unibreakbase.h`, the fifth installed header, declares no function:
          # its public surface is the three `utf*_t` typedefs,
          # `UNIBREAK_VERSION` and `unibreak_version`.
          # `R` in the nm letter is the read-only data `unibreak_version` lands
          # in; requiring `T` for it would be a check of that rather than of
          # whether it is exported at all.
          for symbol in \
            init_linebreak \
            set_linebreaks_utf8 set_linebreaks_utf16 set_linebreaks_utf32 \
            set_linebreaks_utf8_per_code_point \
            set_linebreaks_utf16_per_code_point \
            is_line_breakable \
            init_wordbreak \
            set_wordbreaks_utf8 set_wordbreaks_utf16 set_wordbreaks_utf32 \
            init_graphemebreak \
            set_graphemebreaks_utf8 set_graphemebreaks_utf16 \
            set_graphemebreaks_utf32 \
            ub_get_next_char_utf8 ub_get_next_char_utf16 ub_get_next_char_utf32 \
            unibreak_version
          do
            grep -Eq " [BDGTR] ${symbol}\$" "$RUNNER_TEMP/exports.txt" \
              || { echo "::error::$symbol is not exported from $so" >&2; exit 1; }
          done

      # The soname is upstream's own `-version-info 8:0:0`
      # (src/Makefile.am:10), so the file name and the `DT_NEEDED` name are
      # facts to read out of the produced binary rather than to assert.
      - name: soname is upstream's libunibreak.so.8
        run: |
          set -euo pipefail
          so=""
          for f in zig-out/lib/libunibreak.so.*; do
            case "$f" in *.so.8) continue ;; esac
            so="$f"
            break
          done
          test -n "$so"
          objdump -p "$so" | grep SONAME
          objdump -p "$so" | grep -q 'SONAME.*libunibreak\.so\.8$'

      # Every matrix target that can carry a shared object, in the shared
      # delivery. Named one at a time rather than as a bare `check`, because a
      # bare `check -Dlinkage=dynamic` also walks wasm32-wasi, and that target
      # is refused for this option rather than built.
      - name: compile the shared variant for every target with a dynamic linker
        run: |
          set -euo pipefail
          for t in x86_64-linux-gnu aarch64-linux-gnu aarch64-macos-none \
                   x86_64-windows-gnu riscv64-linux-gnu
          do
            echo "== $t"
            zig build check -Dtarget="$t" -Dlinkage=dynamic $ZIG_FLAGS
          done

      # The refusal itself. `set -e` is deliberately off for this step: the
      # command is expected to fail, and `out=$(...)` under `-e` would abort
      # before the status could be examined.
      - name: wasm32-wasi refuses -Dlinkage=dynamic instead of delivering an archive
        run: |
          set -uo pipefail
          out=$(zig build check -Dtarget=wasm32-wasi -Dlinkage=dynamic $ZIG_FLAGS 2>&1)
          status=$?
          echo "$out"
          test "$status" -ne 0
          echo "$out" | grep -q "no dynamic linker"
          echo "$out" | grep -q -- "-Dlinkage=static"

  # `-Druntime=true` is a compile-level gate here and only here. Its
  # behavioural contract — an explicit load, no fallback, no automatic retry,
  # a panic before a successful load — belongs to the runtime loader's own
  # tests, and `build.zig` runs those under its `test` step, the one registered
  # as `b.step("test", "Run the facade tests and every API operation")`. Under
  # `-Druntime=true` that step builds the same dispatch this job compiles. A CI
  # runner has no provider to name and no reason to fake one, so
  # `LIBUNIBREAK_TEST_PROVIDER` is unset there and the loader cases at the top
  # of `tests.zig` report the missing provider rather than passing. What this
  # job does establish is that the generated dispatch, the facade and the
  # explicit exercise agree on the translated types — a mismatch there would be
  # two nominally distinct copies of the same extern structs.
  #
  # The shared-delivery half names its targets one at a time for the same
  # reason the `shared` job does: `-Dlinkage=dynamic` is refused for
  # `wasm32-wasi`, and `-Druntime` being orthogonal to `-Dlinkage` does not
  # change what a refused linkage does.
  runtime:
    name: runtime dispatch compiles for the six-target matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile the runtime-loaded graph
        run: zig build check -Druntime=true $ZIG_FLAGS
      - name: Compile the runtime-loaded graph over shared delivery
        run: |
          set -euo pipefail
          for t in x86_64-linux-gnu aarch64-linux-gnu aarch64-macos-none \
                   x86_64-windows-gnu riscv64-linux-gnu
          do
            echo "== $t"
            zig build check -Dtarget="$t" -Druntime=true -Dlinkage=dynamic $ZIG_FLAGS
          done

  cross:
    name: check ${{ matrix.target }} (compile only, nothing runs)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Compiles the C core, the facade, the explicit API exercise, the tests,
      # the example and upstream's own C harness for this target. Running
      # nothing: a compile is not a test result, and this job's name says so.
      - name: Compile the full library and public API
        run: zig build check -Dtarget=${{ matrix.target }} $ZIG_FLAGS

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The proof that the published module resolves from a package that did not
      # write it: a module that builds from the inside and does not resolve from
      # outside would pass every other job here. The consumer uses
      # dep.module("libunibreak") and no dep.artifact, by relative path, so the
      # proof does not depend on a published state of the world.
      #
      # Three runs, not one, because the two delivery options are only real
      # evidence if a dependent can reach them. The default is the static linked
      # graph this SDK has always produced; `dynamic` links the shared object;
      # `runtime` links nothing into the module at all and dispatches through
      # the table an explicit load fills. `build.zig`'s own `consumer` step
      # forwards both options to this package, so the same three are reachable
      # from the package root as well.
      - name: Build and run the consumer
        working-directory: consumer
        run: zig build run $ZIG_FLAGS
      - name: Build and run the consumer against the shared delivery
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic $ZIG_FLAGS
      - name: Build and run the consumer with runtime dispatch
        working-directory: consumer
        run: zig build run -Druntime=true $ZIG_FLAGS
